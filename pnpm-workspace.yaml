nodeLinker: hoisted

# Dependabot transitive-vuln overrides. Every alert in this repo is on a
# development-scope transitive copy whose parent pins it, so a plain in-range
# refresh cannot reach any of them. Each entry MUST carry a GHSA reference so
# the carve-out can be dropped once the parent ships the patched version.
#
# Prefer bumping the parent over adding an entry here: an override that forces
# a version its parent never declared is a standing compatibility risk, and a
# parent that has already moved on makes the carve-out permanent dead config.
# The undici entry lived here until testcontainers 12 arrived declaring undici
# ^8.9.0, which retired it. The uuid advisory never needed an entry at all: the
# same upgrade brought dockerode 5, which dropped its uuid dependency outright.
overrides:
  # GHSA-587h-7wmj-h5pm / GHSA-698v-4r3x-3vcv / GHSA-9jrq-w75r-8gcw /
  # GHSA-r825-w8mm-5pxw / GHSA-rq7h-c2jc-7f22: vite >=8.0.0 <=8.1.5, patched
  # 8.1.6. Transitive via vitest.
  # Previously GHSA-fx2h-pf6j-xcff + GHSA-v6wh-96g9-6wx3 (<=8.0.15).
  'vite@>=8.0.0 <8.1.6': 8.1.6
  # GHSA-f596-whhp-79r4 / GHSA-m9gg-hp2v-232j: @grpc/grpc-js >=1.14.0 <1.14.5,
  # patched 1.14.5. Transitive.
  '@grpc/grpc-js@>=1.14.0 <1.14.5': 1.14.5
  # GHSA-3jxr-9vmj-r5cp / GHSA-q2hr-2g5m-vwhr: brace-expansion ReDoS spans
  # three release lines here (1.x, 2.x, 5.x are all installed). Patch each on
  # its own major so no parent's declared range is crossed.
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  # GHSA-5gmw-xhrv-c9v3 / GHSA-85c8-ppgw-ccpr: tinypool <2.1.2, patched 2.1.2.
  # Transitive via vitest (declares ^2.1.0).
  'tinypool@>=2.0.0 <2.1.2': 2.1.2

allowBuilds:
  cpu-features: false
  lefthook: true
  protobufjs: false
  ssh2: false
